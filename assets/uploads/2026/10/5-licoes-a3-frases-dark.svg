<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Da frase da entrevista à atividade</title><desc>Quatro linhas ligando frase real da entrevista, oportunidade de melhoria e atividade do plano.</desc><style>
:root{--t:#e3e7ea;--ln:#8d97a1;--bx:#1d2227;--bd:#3a424a;--gp:#171b1f;--ac:#5cc8bf;--as:#1f3b39;--al:#e08a5c}

.t{fill:var(--t);font:14px "Segoe UI",Arial,sans-serif}
.ti{fill:var(--t);font:bold 16px Lora,Georgia,serif}
.tb{fill:var(--t);font:bold 14px "Segoe UI",Arial,sans-serif}
.ta{fill:var(--ac);font:bold 14px "Segoe UI",Arial,sans-serif}
.tq{fill:var(--t);font:italic 14px "Segoe UI",Arial,sans-serif}
.box{fill:var(--bx);stroke:var(--bd);stroke-width:1.2}
.grp{fill:var(--gp);stroke:var(--bd);stroke-width:1}
.hi{fill:var(--as);stroke:var(--ac);stroke-width:1.5}
.warn{fill:var(--bx);stroke:var(--al);stroke-width:1.5}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.ar{stroke:var(--ln);stroke-width:1.6;fill:none;marker-end:url(#a)}
.ah{fill:var(--ln)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><text class="ti" x="500" text-anchor="middle"><tspan x="500" y="26">Do que dói no dia a dia à atividade do plano</tspan></text><text class="ta" x="175.0" text-anchor="middle"><tspan x="175.0" y="62">Frase da entrevista</tspan></text><text class="ta" x="500.0" text-anchor="middle"><tspan x="500.0" y="62">Oportunidade</tspan></text><text class="ta" x="825.0" text-anchor="middle"><tspan x="825.0" y="62">Atividade do plano</tspan></text><rect class="grp" x="20" y="80" width="310" height="76" rx="6"/><text class="tq" x="175.0" text-anchor="middle"><tspan x="175.0" y="114.0">“Existe instabilidade em</tspan><tspan x="175.0" y="132.0">ambiente não-produtivo.”</tspan></text><path class="ar" d="M330 118L385 118"/><rect class="box" x="385" y="80" width="230" height="76" rx="6"/><text class="tb" x="500.0" text-anchor="middle"><tspan x="500.0" y="114.0">Ambientes</tspan><tspan x="500.0" y="132.0">padronizados</tspan></text><path class="ar" d="M615 118L670 118"/><rect class="hi" x="670" y="80" width="310" height="76" rx="6"/><text class="t" x="825.0" text-anchor="middle"><tspan x="825.0" y="114.0">DEV, HML e PRD com a</tspan><tspan x="825.0" y="132.0">mesma configuração</tspan></text><rect class="grp" x="20" y="175" width="310" height="76" rx="6"/><text class="tq" x="175.0" text-anchor="middle"><tspan x="175.0" y="209.0">“Não existe migração de</tspan><tspan x="175.0" y="227.0">estrutura de BD em pipeline.”</tspan></text><path class="ar" d="M330 213L385 213"/><rect class="box" x="385" y="175" width="230" height="76" rx="6"/><text class="tb" x="500.0" text-anchor="middle"><tspan x="500.0" y="209.0">Migração de BD</tspan><tspan x="500.0" y="227.0">automatizada</tspan></text><path class="ar" d="M615 213L670 213"/><rect class="hi" x="670" y="175" width="310" height="76" rx="6"/><text class="t" x="825.0" text-anchor="middle"><tspan x="825.0" y="209.0">Definir a migração de BD</tspan><tspan x="825.0" y="227.0">no pipeline, fora da change</tspan></text><rect class="grp" x="20" y="270" width="310" height="76" rx="6"/><text class="tq" x="175.0" text-anchor="middle"><tspan x="175.0" y="313.0">“Muito trabalho manual.”</tspan></text><path class="ar" d="M330 308L385 308"/><rect class="box" x="385" y="270" width="230" height="76" rx="6"/><text class="tb" x="500.0" text-anchor="middle"><tspan x="500.0" y="304.0">Release sem</tspan><tspan x="500.0" y="322.0">aprovação manual</tspan></text><path class="ar" d="M615 308L670 308"/><rect class="hi" x="670" y="270" width="310" height="76" rx="6"/><text class="t" x="825.0" text-anchor="middle"><tspan x="825.0" y="304.0">Retirar a aprovação do analista</tspan><tspan x="825.0" y="322.0">para release em DEV</tspan></text><rect class="grp" x="20" y="365" width="310" height="76" rx="6"/><text class="tq" x="175.0" text-anchor="middle"><tspan x="175.0" y="399.0">“Não há conhecimento adequado</tspan><tspan x="175.0" y="417.0">no time de sustentação.”</tspan></text><path class="ar" d="M330 403L385 403"/><rect class="box" x="385" y="365" width="230" height="76" rx="6"/><text class="tb" x="500.0" text-anchor="middle"><tspan x="500.0" y="399.0">Conhecimento</tspan><tspan x="500.0" y="417.0">documentado</tspan></text><path class="ar" d="M615 403L670 403"/><rect class="hi" x="670" y="365" width="310" height="76" rx="6"/><text class="t" x="825.0" text-anchor="middle"><tspan x="825.0" y="399.0">Documentar o KT</tspan><tspan x="825.0" y="417.0">de um sistema</tspan></text></svg>