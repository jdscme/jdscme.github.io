<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img"><title>Visão de integração genérica</title><desc>Canais chegam a um API Gateway que expõe backends novos e, por um balanceador Apache, os legados.</desc><style>
:root{--t:#16191d;--ln:#8a929b;--bx:#ffffff;--bd:#c9ced4;--gp:#eef1f4;--ac:#0b6e69;--as:#d9efed;--al:#b5562b}

.t{fill:var(--t);font:14px "Segoe UI",Arial,sans-serif}
.ti{fill:var(--t);font:bold 16px Lora,Georgia,serif}
.tb{fill:var(--t);font:bold 14px "Segoe UI",Arial,sans-serif}
.ta{fill:var(--ac);font:bold 14px "Segoe UI",Arial,sans-serif}
.tq{fill:var(--t);font:italic 14px "Segoe UI",Arial,sans-serif}
.box{fill:var(--bx);stroke:var(--bd);stroke-width:1.2}
.grp{fill:var(--gp);stroke:var(--bd);stroke-width:1}
.hi{fill:var(--as);stroke:var(--ac);stroke-width:1.5}
.warn{fill:var(--bx);stroke:var(--al);stroke-width:1.5}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.ar{stroke:var(--ln);stroke-width:1.6;fill:none;marker-end:url(#a)}
.ah{fill:var(--ln)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><text class="ti" x="500" text-anchor="middle"><tspan x="500" y="26">Visão de integração (genérica)</tspan></text><rect class="grp" x="20" y="60" width="240" height="330" rx="6"/><text class="tb" x="140" text-anchor="middle"><tspan x="140" y="86">Canais</tspan></text><rect class="box" x="40" y="110" width="200" height="60" rx="6"/><text class="t" x="140.0" text-anchor="middle"><tspan x="140.0" y="145.0">Sistemas externos</tspan></text><path class="ar" d="M240 140L320 225"/><rect class="box" x="40" y="198" width="200" height="60" rx="6"/><text class="t" x="140.0" text-anchor="middle"><tspan x="140.0" y="233.0">Sistemas internos</tspan></text><path class="ar" d="M240 228L320 225"/><rect class="box" x="40" y="286" width="200" height="60" rx="6"/><text class="t" x="140.0" text-anchor="middle"><tspan x="140.0" y="321.0">Integrações e processos</tspan></text><path class="ar" d="M240 316L320 225"/><rect class="hi" x="320" y="110" width="130" height="230" rx="6"/><text class="ta" x="385" text-anchor="middle"><tspan x="385" y="205">API</tspan><tspan x="385" y="223">Gateway</tspan></text><text class="tb" x="385" text-anchor="middle"><tspan x="385" y="250">Axway</tspan></text><text class="t" x="385" text-anchor="middle"><tspan x="385" y="272">(HTTPS)</tspan></text><rect class="grp" x="560" y="60" width="420" height="110" rx="6"/><text class="tb" x="770" text-anchor="middle"><tspan x="770" y="86">Backends novos</tspan></text><rect class="box" x="580" y="98" width="380" height="56" rx="6"/><text class="t" x="770.0" text-anchor="middle"><tspan x="770.0" y="131.0">Backends em OpenShift</tspan></text><rect class="grp" x="560" y="200" width="420" height="330" rx="6"/><text class="tb" x="770" text-anchor="middle"><tspan x="770" y="226">Backends legados</tspan></text><rect class="hi" x="580" y="240" width="380" height="44" rx="6"/><text class="t" x="770.0" text-anchor="middle"><tspan x="770.0" y="267.0">Balanceador Apache</tspan></text><path class="ar" d="M770 284L770 302"/><rect class="box" x="580" y="304" width="380" height="40" rx="6"/><text class="t" x="770.0" text-anchor="middle"><tspan x="770.0" y="329.0">Blaze (motor de regras de crédito)</tspan></text><rect class="box" x="580" y="352" width="380" height="40" rx="6"/><text class="t" x="770.0" text-anchor="middle"><tspan x="770.0" y="377.0">Serviços em WebLogic</tspan></text><rect class="box" x="580" y="400" width="380" height="52" rx="6"/><text class="t" x="770" text-anchor="middle"><tspan x="770" y="421">Plataforma de integração</tspan><tspan x="770" y="439">TIBCO</tspan></text><rect class="box" x="580" y="460" width="380" height="52" rx="6"/><text class="t" x="770" text-anchor="middle"><tspan x="770" y="481">Autbank</tspan><tspan x="770" y="499">(financiamento, tesouraria e contas a pagar)</tspan></text><path class="ar" d="M450 200L560 126"/><path class="ar" d="M450 250L560 262"/></svg>