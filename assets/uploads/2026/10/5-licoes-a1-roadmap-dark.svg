<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><title>Roadmap do plano diretor: 8 pilares e 3 ondas</title><desc>Oito pilares nas linhas e três ondas por impacto nas colunas, com a onda 1 e suas três soluções priorizadas em destaque.</desc><style>
:root{--t:#e3e7ea;--ln:#8d97a1;--bx:#1d2227;--bd:#3a424a;--gp:#171b1f;--ac:#5cc8bf;--as:#1f3b39;--al:#e08a5c}

.t{fill:var(--t);font:14px "Segoe UI",Arial,sans-serif}
.ti{fill:var(--t);font:bold 16px Lora,Georgia,serif}
.tb{fill:var(--t);font:bold 14px "Segoe UI",Arial,sans-serif}
.ta{fill:var(--ac);font:bold 14px "Segoe UI",Arial,sans-serif}
.tq{fill:var(--t);font:italic 14px "Segoe UI",Arial,sans-serif}
.box{fill:var(--bx);stroke:var(--bd);stroke-width:1.2}
.grp{fill:var(--gp);stroke:var(--bd);stroke-width:1}
.hi{fill:var(--as);stroke:var(--ac);stroke-width:1.5}
.warn{fill:var(--bx);stroke:var(--al);stroke-width:1.5}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.ar{stroke:var(--ln);stroke-width:1.6;fill:none;marker-end:url(#a)}
.ah{fill:var(--ln)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><text class="ti" x="500" text-anchor="middle"><tspan x="500" y="26">Roadmap do PDTI: 8 pilares × 3 ondas (FY24 a FY27)</tspan></text><rect class="hi" x="290" y="36" width="330" height="428" rx="6"/><rect class="grp" x="640" y="36" width="170" height="428" rx="6"/><rect class="grp" x="820" y="36" width="160" height="428" rx="6"/><text class="ta" x="455" text-anchor="middle"><tspan x="455" y="60">Onda 1</tspan></text><text class="t" x="455" text-anchor="middle"><tspan x="455" y="76">alto impacto</tspan></text><text class="tb" x="725" text-anchor="middle"><tspan x="725" y="60">Onda 2</tspan></text><text class="t" x="725" text-anchor="middle"><tspan x="725" y="76">médio impacto</tspan></text><text class="tb" x="900" text-anchor="middle"><tspan x="900" y="60">Onda 3</tspan></text><text class="t" x="900" text-anchor="middle"><tspan x="900" y="76">baixo impacto</tspan></text><path class="ln" d="M20 128L280 128"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="109.0">Eficiência operacional de TI</tspan></text><path class="ln" d="M20 176L280 176"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="157.0">Qualidade de entrega de TI</tspan></text><path class="ln" d="M20 224L280 224"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="205.0">Orientação a dados</tspan></text><path class="ln" d="M20 272L280 272"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="253.0">Continuidade do negócio</tspan></text><path class="ln" d="M20 320L280 320"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="301.0">Eficiência operacional de negócio</tspan></text><path class="ln" d="M20 368L280 368"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="349.0">Otimização de custo</tspan></text><path class="ln" d="M20 416L280 416"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="397.0">Crescimento de receita</tspan></text><path class="ln" d="M20 464L280 464"/><text class="t" x="20" text-anchor="start"><tspan x="20" y="445.0">Regulatório e compliance</tspan></text><rect class="box" x="325" y="100" width="260" height="70" rx="6"/><text class="tb" x="455.0" text-anchor="middle"><tspan x="455.0" y="140.0">Criação de framework de TI</tspan></text><rect class="box" x="325" y="218" width="260" height="70" rx="6"/><text class="tb" x="455.0" text-anchor="middle"><tspan x="455.0" y="258.0">Seleção de software</tspan></text><rect class="box" x="325" y="336" width="260" height="70" rx="6"/><text class="tb" x="455.0" text-anchor="middle"><tspan x="455.0" y="376.0">Aceleração na entrega</tspan></text><text class="t" x="725" text-anchor="middle"><tspan x="725" y="268">demais</tspan><tspan x="725" y="286">soluções</tspan></text><text class="t" x="900" text-anchor="middle"><tspan x="900" y="268">demais</tspan><tspan x="900" y="286">soluções</tspan></text><text class="ta" x="455" text-anchor="middle"><tspan x="455" y="486">soluções priorizadas</tspan></text></svg>