<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Do roadmap ao plano de ação</title><desc>Roadmap, quatro áreas, exemplos de atividades e o acompanhamento no Jira.</desc><style>
:root{--t:#e3e7ea;--ln:#8d97a1;--bx:#1d2227;--bd:#3a424a;--gp:#171b1f;--ac:#5cc8bf;--as:#1f3b39;--al:#e08a5c}

.t{fill:var(--t);font:14px "Segoe UI",Arial,sans-serif}
.ti{fill:var(--t);font:bold 16px Lora,Georgia,serif}
.tb{fill:var(--t);font:bold 14px "Segoe UI",Arial,sans-serif}
.ta{fill:var(--ac);font:bold 14px "Segoe UI",Arial,sans-serif}
.tq{fill:var(--t);font:italic 14px "Segoe UI",Arial,sans-serif}
.box{fill:var(--bx);stroke:var(--bd);stroke-width:1.2}
.grp{fill:var(--gp);stroke:var(--bd);stroke-width:1}
.hi{fill:var(--as);stroke:var(--ac);stroke-width:1.5}
.warn{fill:var(--bx);stroke:var(--al);stroke-width:1.5}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.ar{stroke:var(--ln);stroke-width:1.6;fill:none;marker-end:url(#a)}
.ah{fill:var(--ln)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><text class="ti" x="500" text-anchor="middle"><tspan x="500" y="26">Do roadmap ao plano de ação de jan/2024</tspan></text><rect class="hi" x="20" y="150" width="150" height="110" rx="6"/><text class="ta" x="95.0" text-anchor="middle"><tspan x="95.0" y="201.0">Roadmap</tspan><tspan x="95.0" y="219.0">do PDTI</tspan></text><path class="ar" d="M170 205L215 96"/><rect class="grp" x="215" y="60" width="200" height="72" rx="6"/><text class="tb" x="315.0" text-anchor="middle"><tspan x="315.0" y="101.0">Regras do jogo</tspan></text><path class="ar" d="M415 96L455 96"/><rect class="box" x="455" y="60" width="260" height="72" rx="6"/><text class="t" x="585.0" text-anchor="middle"><tspan x="585.0" y="101.0">Definir DoR, DoD e matriz RACI</tspan></text><path class="ar" d="M715 96L765 205"/><path class="ar" d="M170 205L215 194"/><rect class="grp" x="215" y="158" width="200" height="72" rx="6"/><text class="tb" x="315.0" text-anchor="middle"><tspan x="315.0" y="199.0">Gestão</tspan></text><path class="ar" d="M415 194L455 194"/><rect class="box" x="455" y="158" width="260" height="72" rx="6"/><text class="t" x="585.0" text-anchor="middle"><tspan x="585.0" y="190.0">Relatório de status das</tspan><tspan x="585.0" y="208.0">demandas no eazyBI</tspan></text><path class="ar" d="M715 194L765 205"/><path class="ar" d="M170 205L215 292"/><rect class="grp" x="215" y="256" width="200" height="72" rx="6"/><text class="tb" x="315.0" text-anchor="middle"><tspan x="315.0" y="297.0">Conhecimento</tspan></text><path class="ar" d="M415 292L455 292"/><rect class="box" x="455" y="256" width="260" height="72" rx="6"/><text class="t" x="585.0" text-anchor="middle"><tspan x="585.0" y="288.0">Documentar o KT</tspan><tspan x="585.0" y="306.0">de um sistema</tspan></text><path class="ar" d="M715 292L765 205"/><path class="ar" d="M170 205L215 390"/><rect class="grp" x="215" y="354" width="200" height="72" rx="6"/><text class="tb" x="315.0" text-anchor="middle"><tspan x="315.0" y="386.0">Infra, DevOps</tspan><tspan x="315.0" y="404.0">e Arquitetura</tspan></text><path class="ar" d="M415 390L455 390"/><rect class="box" x="455" y="354" width="260" height="72" rx="6"/><text class="t" x="585.0" text-anchor="middle"><tspan x="585.0" y="386.0">DEV, HML e PRD iguais;</tspan><tspan x="585.0" y="404.0">tracing distribuído</tspan></text><path class="ar" d="M715 390L765 205"/><rect class="hi" x="765" y="100" width="215" height="210" rx="6"/><text class="ta" x="872" text-anchor="middle"><tspan x="872" y="128">Acompanhamento</tspan></text><text class="t" x="872" text-anchor="middle"><tspan x="872" y="160">Quadro no Jira</tspan><tspan x="872" y="178">Reunião periódica</tspan><tspan x="872" y="196">de status</tspan><tspan x="872" y="214">Gatilhos para novas</tspan><tspan x="872" y="232">melhorias</tspan></text><text class="tb" x="215" text-anchor="start"><tspan x="215" y="455">4 áreas</tspan></text><text class="tb" x="455" text-anchor="start"><tspan x="455" y="455">exemplos de atividades</tspan></text></svg>