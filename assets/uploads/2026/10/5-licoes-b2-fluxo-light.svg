<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img">
<title>Fluxo de valor com fases, portões DoR e DoD e papéis</title>
<style>
:root{--tx:#16191d;--ln:#8a929b;--bx:#ffffff;--bd:#c9ced4;--gp:#eef1f4;--ac:#0b6e69;--as:#d9efed;--wn:#b5562b}

text{fill:var(--tx);font-family:"Segoe UI",Arial,sans-serif;font-size:13px}
.h{font-family:Lora,Georgia,serif;font-size:17px;font-weight:700}
.s{font-size:12px}.b{font-weight:700}.m{text-anchor:middle}.e{text-anchor:end}
.box{fill:var(--bx);stroke:var(--bd);stroke-width:1.2}
.grp{fill:var(--gp);stroke:var(--bd);stroke-width:1}
.accb{fill:var(--as);stroke:var(--ac);stroke-width:1.6}
.wnb{fill:none;stroke:var(--wn);stroke-width:1.5;stroke-dasharray:5 4}
.ln{stroke:var(--ln);stroke-width:1.5;fill:none}
.dash{stroke:var(--ac);stroke-width:1.2;stroke-dasharray:4 4}
.dot{fill:var(--ac)}
text.ta{fill:var(--ac)}text.tw{fill:var(--wn)}
.mk{fill:var(--ln)}
</style>
